name: Playwright CI
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore NuGet packages
        run: dotnet restore
      - name: Build Playwright project
        run: dotnet build YourPlaywrightProject.csproj --configuration Release
      - name: Install Playwright browsers and dependencies
        run: pwsh bin/Release/net8.0/playwright.ps1 install --with-deps
      - name: Run Playwright tests
        run: dotnet test YourPlaywrightProject.csproj --configuration Release --no-build