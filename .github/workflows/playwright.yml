name: Playwright CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: '0 2 * * 1-5'

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  TARGET_FRAMEWORK: 'net8.0'
  BUILD_CONFIGURATION: 'Release'
  PROJECT_PATH: 'PlaywrightPipelineDemo.csproj'

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('PlaywrightPipelineDemo.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore NuGet packages
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build Playwright project
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: playwright-build
          path: bin/${{ env.BUILD_CONFIGURATION }}/${{ env.TARGET_FRAMEWORK }}
          include-hidden-files: true

  test:
    needs: build

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        with:
          build-configuration: ${{ env.BUILD_CONFIGURATION }}
          target-framework: ${{ env.TARGET_FRAMEWORK }}
          browser: ${{ matrix.browser }}

      - name: Run Playwright tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          BROWSER: ${{ matrix.browser }}
        run: >
          dotnet test ${{ env.PROJECT_PATH }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --logger "trx;LogFileName=${{ matrix.browser }}-test-results.trx"
          --results-directory test-results

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Playwright Test Results - ${{ matrix.browser }}
          path: test-results/${{ matrix.browser }}-test-results.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts-${{ matrix.browser }}
          path: bin/${{ env.BUILD_CONFIGURATION }}/${{ env.TARGET_FRAMEWORK }}/test-results/playwright/
          if-no-files-found: warn

      - name: Notify Slack about scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚨 Playwright scheduled test failure\nBranch: ${{ github.ref_name }}\nBrowser: ${{ matrix.browser }}\nWorkflow: ${{ github.workflow }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }